name: cloudflare

on:
  push:
    paths:
      - "soundcloud-mcp-cloudflare/**"
      - ".github/workflows/cloudflare.yml"
  pull_request:
    paths:
      - "soundcloud-mcp-cloudflare/**"
      - ".github/workflows/cloudflare.yml"

defaults:
  run:
    working-directory: soundcloud-mcp-cloudflare

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: soundcloud-mcp-cloudflare/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:md
      - run: pnpm type-check
      - run: pnpm test

  deploy:
    needs: [check]
    # Skips (green, not red) until DEPLOY_ENABLED is set as a repo variable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: soundcloud-mcp-cloudflare/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7e942171573cc4a7cd4238448e646c58
          workingDirectory: soundcloud-mcp-cloudflare
