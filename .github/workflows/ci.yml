name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:md
      # Check Node and Workers with separate global types.
      - run: pnpm typecheck
      - run: pnpm test
      # Bundle for workerd; unit tests use stubbed fetch.
      - run: pnpm exec wrangler deploy --dry-run --outdir /tmp/worker-bundle

  deploy:
    needs: [check]
    # Enable with the DEPLOY_ENABLED repo variable. Deploy every push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keeps the ENABLE_WRITE_TOOLS secret in step with the repo variable, so
      # turning write tools on or off needs no local wrangler login.
      - if: vars.ENABLE_WRITE_TOOLS != ''
        run: printf '%s' "$VALUE" | pnpm exec wrangler secret put ENABLE_WRITE_TOOLS
        env:
          VALUE: ${{ vars.ENABLE_WRITE_TOOLS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7e942171573cc4a7cd4238448e646c58
      - run: pnpm worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7e942171573cc4a7cd4238448e646c58
