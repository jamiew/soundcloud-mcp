name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:md
      # Typechecks the Node and Workers halves separately — they have different
      # global types even though they share source files.
      - run: pnpm typecheck
      - run: pnpm test
      # Proves the worker still bundles. Green tests do not — they stub fetch.
      - run: pnpm exec wrangler deploy --dry-run --outdir /tmp/worker-bundle

  deploy:
    needs: [check]
    # Skips (green, not red) until DEPLOY_ENABLED is set as a repo variable.
    #
    # Deliberately unfiltered by path: a docs-only push redeploys an identical
    # bundle, which costs nothing, whereas a path filter that misreads a code
    # change as docs silently fails to deploy. Prefer the harmless direction.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7e942171573cc4a7cd4238448e646c58
