name: Publish to npm & MCP Registry

on:
  release:
    types: [published]

# id-token lets npm trusted publishing and the MCP Registry verify this workflow.
permissions:
  id-token: write
  contents: read

# Never run two publishes at once or cancel one midway.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # Node 24 ships the npm that supports trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The first version is published by hand, because npm only accepts a trusted
      # publisher for a package that already exists. Skip a version that's already up.
      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "$name@$RELEASE_VERSION is already on npm"
          else
            npm publish
          fi

      - name: Install mcp-publisher
        env:
          # From registry_1.8.21_checksums.txt in the v1.8.21 release.
          MCP_PUBLISHER_VERSION: v1.8.21
          MCP_PUBLISHER_SHA256: ca2e5b24e8fc2718be4bb58ab086b39b7d60c79840c24b2057bc3f36d6ab2a59
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          jq --arg v "$RELEASE_VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher publish
