# Build-script approvals for this single-package repo.
allowBuilds:
  core-js-pure: true
  esbuild: true
  workerd: true
# markdownlint-cli2 pins vulnerable versions of these. Drop each override once
# its upstream range clears the advisory.
overrides:
  markdownlint-cli2>smol-toml: ^1.9.0
  markdown-it@<15.0.3: ^15.0.3
  katex@<0.18.2: ^0.18.2
